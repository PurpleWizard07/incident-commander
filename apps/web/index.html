<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Firebro: a WebMCP-native production incident-response console where an AI agent investigates through structured tools while a human retains authority over production changes."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Type system (design pass, 2026-08-31): Instrument Sans for UI + display, IBM Plex Mono for
      every numeral, label and data row. The @font-face rules live in src/index.css and the woff2
      files are served from this origin out of public/fonts/ — see that folder's README.txt for
      licensing (both families are SIL OFL 1.1) and for how to regenerate them.

      There is deliberately no stylesheet link to fonts.googleapis.com and no preconnect to
      fonts.gstatic.com. Both were measured against production and both cost real time: the
      stylesheet link is render blocking (440ms, FCP 2.9s, performance 0.98 -> 0.88), and even with
      that removed the cross-origin font fetch cost 0.3s of LCP, because the LCP element is the
      incident masthead title and it waits on the display face.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-sans-latin-var.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-latin-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-latin-500.woff2" />
    <title>Firebro</title>
    <!--
      WebMCP origin trial token, scoped to https://firebro.netlify.app, expires 2026-11-17.
      Registered at https://developers.chrome.com/origintrials — see phase-summary.md decisions log
      (2026-09-03) and implementation-plan.md §21.1. Chrome still also works via
      chrome://flags/#enable-webmcp-testing without this; ChatGPT's in-app browser needs neither.

      Re-registered 2026-09-03 as a plain FIRST-PARTY token — payload is exactly
      {"origin":"https://firebro.netlify.app:443","feature":"WebMCP","expiry":1794873600}, with no
      isThirdParty and no isSubdomain. The previous token had both. isThirdParty:true is for a
      script embedded on *other* sites: Chrome expects such a token to be injected at runtime by
      that script and validates it against the script's origin, so it is rejected when it sits in a
      static meta tag on a first-party page — which is what this is. Keep it first-party. Because
      isSubdomain is now absent the token covers this exact host only, which is all that is
      deployed; a Netlify deploy-preview URL (deploy-preview-N--firebro.netlify.app) is a different
      origin and will need the flag.
    -->
    <meta http-equiv="origin-trial" content="Alq6exhiVSuHSKgaqyh2Ri2Ut0pZRzjkt4MvMuGJKJCL+9uYCOqCl4ePWn54aImniA6xfFtbWROO8pB6TurU7gIAAABTeyJvcmlnaW4iOiJodHRwczovL2ZpcmVicm8ubmV0bGlmeS5hcHA6NDQzIiwiZmVhdHVyZSI6IldlYk1DUCIsImV4cGlyeSI6MTc5NDg3MzYwMH0=">
